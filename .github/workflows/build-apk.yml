name: Build Mr Bola Physics APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Project Directory & Install Dependencies
        run: |
          if [ -d "mobile" ]; then
            echo "APP_DIR=mobile" >> $GITHUB_ENV
            cd mobile
          else
            echo "APP_DIR=." >> $GITHUB_ENV
          fi
          npm install --legacy-peer-deps

      - name: Prebuild Native Android Project
        run: |
          cd ${{ env.APP_DIR }}
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build Android Release APK
        run: |
          cd ${{ env.APP_DIR }}/android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false --no-daemon

      - name: Verify Generated APK
        run: |
          echo "Generated APK files:"
          find . -name "*.apk" -ls

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MrBola-Physics-APK
          path: |
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
            **/*.apk
          retention-days: 14
